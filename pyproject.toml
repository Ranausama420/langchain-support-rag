[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-support-rag"
version = "0.1.0"
description = "Evidence-first software support with Chroma, LangGraph and fair model comparisons"
requires-python = ">=3.11,<3.14"
dependencies = ["langchain-core", "langchain-openai", "langchain-ollama", "langchain-text-splitters", "langgraph", "chromadb", "pydantic-settings", "fastapi", "uvicorn", "streamlit", "httpx"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
studio = ["langgraph-cli[inmem]"]

[project.scripts]
support-rag = "support_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
